[package]
name = "nixplay"
version = "0.1.0"
edition = "2021"
description = "Friendly AirPlay 2 audio, video casting and real-time screen mirroring for Linux (Mint, Steam Deck, Raspberry Pi)"
license = "GPL-3.0-or-later"

[dependencies]
aes = "0.8"
anyhow = "1"
axum = { version = "0.8", features = ["ws", "json", "multipart"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
hkdf = "0.12"
if-addrs = "0.13"
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
mdns-sd = "0.13"
num-bigint = "0.4"
plist = "1"
png = "0.17"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "process", "macros", "signal", "io-util", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
